<header class="app-header">
  <button class="menu-button" type="button" aria-label="Ouvrir la navigation" (click)="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="app-name" routerLink="/home">
    <img src="/xtensus_logo.jfif" alt="" />
    <span>XTENSUS HR</span>
  </a>

  <div class="user-menu">
    <a class="avatar-link" routerLink="/profile" aria-label="Ouvrir mon profil">
      @if (user()?.photoUrl) { <img class="avatar" [src]="photoUrl()" alt="Photo de profil" /> }
      @else { <span class="avatar avatar-fallback">{{ initials() }}</span> }
    </a>
    <div class="identity" aria-label="Utilisateur connecte">
      <span class="name">{{ fullName() }}</span>
      <span class="role">{{ user()?.role }}</span>
    </div>
    <button type="button" class="logout-button" (click)="logout()">Se déconnecter</button>
  </div>
</header>
