<header class="app-header">
  <button class="menu-button" type="button" aria-label="Open navigation" (click)="toggleSidebar()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="app-name" routerLink="/home">
    <img src="/xtensus_logo.jfif" alt="" />
    <span>XTENSUS HR</span>
  </a>

  <div class="user-menu">
    <div class="identity" aria-label="Current user">
      <span class="name">{{ fullName() }}</span>
      <span class="role">{{ user()?.role }}</span>
    </div>
    <button type="button" class="logout-button" (click)="logout()">Logout</button>
  </div>
</header>
