<div class="layout-shell" [class.sidebar-open]="layoutState.sidebarOpen()">
  <app-header />

  <div class="content-shell">
    <aside class="sidebar">
      <app-sidebar />
    </aside>

    @if (layoutState.sidebarOpen()) {
      <button
        class="backdrop"
        type="button"
        aria-label="Close navigation"
        (click)="layoutState.closeSidebar()"
      ></button>
    }

    <main class="main-content" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
