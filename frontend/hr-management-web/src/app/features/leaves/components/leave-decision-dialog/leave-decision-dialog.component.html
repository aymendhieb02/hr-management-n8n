<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="decision-title">
    <h2 id="decision-title">{{ mode() === 'approve' ? 'Approuver la demande' : 'Refuser la demande' }}</h2>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span>Commentaire</span>
        <textarea formControlName="comment" maxlength="1000"></textarea>
        @if (form.controls.comment.touched && form.controls.comment.hasError('required')) {
          <p class="field-error">Le commentaire est obligatoire.</p>
        }
      </label>
      @if(mode()==='approve'){<label class="form-field checkbox-field"><input type="checkbox" formControlName="saturdayCounts"/><span>Compter le samedi comme jour travaillé pour cette demande</span></label><p class="field-hint">Le nombre de jours débité sera recalculé en tenant compte de ce choix et des jours fériés.</p>}
      @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
      <div class="dialog-actions">
        <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Annuler</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Enregistrement...' : (mode() === 'approve' ? 'Approuver' : 'Refuser') }}
        </button>
      </div>
    </form>
  </section>
</div>
