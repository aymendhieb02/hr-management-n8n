<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="balance-form-title">
    <h2 id="balance-form-title">{{ balance() ? 'Edit Leave Balance' : 'Add Leave Balance' }}</h2>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span>User</span>
        <select formControlName="userId">
          <option [ngValue]="null">Select user</option>
          @for (user of users(); track user.id) {
            <option [ngValue]="user.id">{{ user.firstName }} {{ user.lastName }}</option>
          }
        </select>
      </label>
      <label class="form-field">
        <span>Leave Type</span>
        <select formControlName="leaveTypeId">
          <option [ngValue]="null">Select leave type</option>
          @for (type of leaveTypes(); track type.id) { <option [ngValue]="type.id">{{ type.name }}</option> }
        </select>
      </label>
      <div class="form-grid">
        <label class="form-field"><span>Year</span><input formControlName="year" type="number" /></label>
        <label class="form-field"><span>Total Days</span><input formControlName="totalDays" type="number" min="0" /></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">Save</button>
      </div>
    </form>
  </section>
</div>
