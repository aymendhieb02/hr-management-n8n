<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="delete-position-title">
    <h2 id="delete-position-title">Supprimer le poste</h2>
    <p>Voulez-vous supprimer <strong>{{ position().title }}</strong> ?</p>
    <p class="description">La suppression peut être refusée si des employés occupent ce poste.</p>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Annuler</button>
      <button class="danger-button" type="button" (click)="confirmDelete.emit()" [disabled]="loading()">
        {{ loading() ? 'Suppression...' : 'Supprimer' }}
      </button>
    </div>
  </section>
</div>
