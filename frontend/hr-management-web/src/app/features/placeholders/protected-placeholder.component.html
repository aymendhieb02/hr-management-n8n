<main class="page-shell">
  <section class="summary">
    <p class="eyebrow">XTENSUS HR</p>
    <h1>{{ title() }}</h1>
    @if (user()) {
      <dl>
        <div>
          <dt>Name</dt>
          <dd>{{ fullName() }}</dd>
        </div>
        <div>
          <dt>Email</dt>
          <dd>{{ user()?.email }}</dd>
        </div>
        <div>
          <dt>Role</dt>
          <dd>{{ user()?.role }}</dd>
        </div>
      </dl>
    }
  </section>
</main>
