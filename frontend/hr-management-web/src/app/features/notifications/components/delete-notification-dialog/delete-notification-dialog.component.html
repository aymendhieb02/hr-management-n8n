<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="delete-notification-title">
    <h2 id="delete-notification-title">Delete Notification</h2>
    <p>Delete <strong>{{ notification().title }}</strong>?</p>
    @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
      <button class="danger-button" type="button" (click)="confirmDelete.emit()" [disabled]="loading()">Delete</button>
    </div>
  </section>
</div>
