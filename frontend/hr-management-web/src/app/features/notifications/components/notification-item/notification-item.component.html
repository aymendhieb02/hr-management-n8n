<article class="state">
  <header class="page-header">
    <div>
      <h2>{{ notification().title }}</h2>
      <p>{{ notification().createdAt }}</p>
    </div>
    <span class="badge" [class.warning]="!notification().read" [class.muted]="notification().read">
      {{ notification().read ? 'Read' : 'Unread' }}
    </span>
  </header>
  <p>{{ notification().message }}</p>
  <div class="dialog-actions">
    @if (!notification().read) {
      <button class="secondary-button" type="button" (click)="markRead.emit(notification())">Mark as read</button>
    }
    <button class="danger-button" type="button" (click)="delete.emit(notification())">Delete</button>
  </div>
</article>
