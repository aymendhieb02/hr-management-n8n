<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="user-form-title">
    <h2 id="user-form-title">{{ title() }}</h2>
    @if(generalError()){<p class="dialog-error" role="alert">{{generalError()}}</p>}
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-grid">
        <label class="form-field">
          <span>Nom d'utilisateur</span>
          <input formControlName="username" maxlength="100" />
          @if (fieldError('username')) { <p class="field-error">{{ fieldError('username') }}</p> }
        </label>

        <label class="form-field">
          <span>Email</span>
          <input formControlName="email" maxlength="150" type="email" />
          @if (fieldError('email')) { <p class="field-error">{{ fieldError('email') }}</p> }
        </label>

        <label class="form-field">
          <span>Prénom</span>
          <input formControlName="firstName" maxlength="100" />
          @if (fieldError('firstName')) { <p class="field-error">{{ fieldError('firstName') }}</p> }
        </label>

        <label class="form-field">
          <span>Nom</span>
          <input formControlName="lastName" maxlength="100" />
          @if (fieldError('lastName')) { <p class="field-error">{{ fieldError('lastName') }}</p> }
        </label>

        <label class="form-field">
          <span>Téléphone</span>
          <input formControlName="phone" maxlength="8" inputmode="numeric" pattern="[0-9]*" />
          @if (fieldError('phone')) { <p class="field-error">{{ fieldError('phone') }}</p> }
        </label>

        <label class="form-field">
          <span>Adresse</span>
          <input formControlName="address" maxlength="255" />
        </label>

        <label class="form-field">
          <span>Date de naissance</span>
          <input formControlName="birthDate" type="date" [max]="maxBirthDate()" />
          @if (fieldError('birthDate')) { <p class="field-error">{{ fieldError('birthDate') }}</p> }
        </label>

        <label class="form-field">
          <span>Sexe</span>
          <select formControlName="sex">
            <option value="HOMME">Homme</option>
            <option value="FEMME">Femme</option>
          </select>
        </label>

        <label class="form-field">
          <span>Date d'embauche</span>
          <input formControlName="hireDate" type="date" />
        </label>

        @if (roleEditable()) { <label class="form-field">
          <span>Rôle</span>
          <select formControlName="role">
            @for (role of roles; track role) { <option [value]="role">{{ roleLabels[role] }}</option> }
          </select>
          @if (fieldError('role')) { <p class="field-error">{{ fieldError('role') }}</p> }
        </label> }
        @if (!user()) { <label class="form-field photo-field"><span>Photo de profil <small>(facultatif)</small></span><span class="file-picker"><span class="file-icon">📷</span><span class="file-copy"><strong>{{photoName||'Choisir une photo'}}</strong><small>{{photoName?'Cliquez pour remplacer le fichier':'JPG, PNG ou WebP · 10 Mo maximum'}}</small></span><span class="file-action">Parcourir</span><input type="file" accept="image/jpeg,image/png,image/webp" (change)="selectPhoto($event)" /></span>@if(photoError){<p class="field-error">{{photoError}}</p>}</label> }

        <label class="form-field">
          <span>Poste</span>
          <select formControlName="positionId">
            <option [ngValue]="null">Sélectionnez un poste</option>
            @for (position of positions(); track position.id) {
              <option [ngValue]="position.id">{{ position.title }}</option>
            }
          </select>
          @if (fieldError('positionId')) { <p class="field-error">{{ fieldError('positionId') }}</p> }
        </label>

        <label class="form-field">
          <span>Type de contrat</span>
          <select formControlName="typeContractId">
            <option [ngValue]="null">Sélectionnez un type de contrat</option>
            @for (contract of typeContracts(); track contract.id) {
              <option [ngValue]="contract.id">{{ contract.name }}</option>
            }
          </select>
          @if (fieldError('typeContractId')) { <p class="field-error">{{ fieldError('typeContractId') }}</p> }
        </label>

        @if (!managerMode() || canChooseManager()) { <label class="form-field">
          <span>Manager</span>
          <select formControlName="managerId">
            <option [ngValue]="null">Aucun manager</option>
            @for (manager of eligibleManagers(); track manager.id) {
              <option [ngValue]="manager.id">{{ manager.firstName }} {{ manager.lastName }}</option>
            }
          </select>
        </label> }
      </div>

      <div class="dialog-actions">
        <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Annuler</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </div>
    </form>
  </section>
</div>
