<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="password-dialog-title">
    <h2 id="password-dialog-title">Reset Password</h2>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span>New password</span>
        <input formControlName="newPassword" maxlength="100" type="password" autocomplete="new-password" />
        @if (passwordError()) { <p class="field-error">{{ passwordError() }}</p> }
      </label>

      <label class="form-field">
        <span>Confirm password</span>
        <input formControlName="confirmPassword" maxlength="100" type="password" autocomplete="new-password" />
        @if (confirmError()) { <p class="field-error">{{ confirmError() }}</p> }
      </label>

      @if (error()) {
        <p class="form-error" role="alert">{{ error() }}</p>
      }

      <div class="dialog-actions">
        <button class="secondary-button" type="button" (click)="close()" [disabled]="loading()">Cancel</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Saving...' : 'Save Password' }}
        </button>
      </div>
    </form>
  </section>
</div>
