<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="delete-user-title">
    <h2 id="delete-user-title">Delete User</h2>
    <p>Delete <strong>{{ user().firstName }} {{ user().lastName }}</strong> ({{ user().username }})?</p>
    <p class="description">Deletion may fail when leave requests, balances, or notifications reference this user.</p>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
      <button class="danger-button" type="button" (click)="confirmDelete.emit()" [disabled]="loading()">
        {{ loading() ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </section>
</div>
