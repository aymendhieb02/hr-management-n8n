<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="delete-department-title">
    <h2 id="delete-department-title">Delete Department</h2>
    <p>Delete <strong>{{ department().name }}</strong>?</p>
    <p class="description">Deletion may fail when users reference this department.</p>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
      <button class="danger-button" type="button" (click)="confirmDelete.emit()" [disabled]="loading()">
        {{ loading() ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </section>
</div>
