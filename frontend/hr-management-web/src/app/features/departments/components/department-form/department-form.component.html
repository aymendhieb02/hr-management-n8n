<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="department-form-title">
    <h2 id="department-form-title">{{ department() ? 'Edit Department' : 'Add Department' }}</h2>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="form-field">
        <span>Name</span>
        <input formControlName="name" maxlength="100" />
        @if (fieldError('name')) {
          <p class="field-error">{{ fieldError('name') }}</p>
        }
      </label>

      <label class="form-field">
        <span>Description</span>
        <textarea formControlName="description" maxlength="255"></textarea>
        @if (fieldError('description')) {
          <p class="field-error">{{ fieldError('description') }}</p>
        }
      </label>

      <div class="dialog-actions">
        <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
        <button class="primary-button" type="submit" [disabled]="form.invalid || loading()">
          {{ loading() ? 'Saving...' : 'Save' }}
        </button>
      </div>
    </form>
  </section>
</div>
