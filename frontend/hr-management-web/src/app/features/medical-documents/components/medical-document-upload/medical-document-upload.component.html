<section class="state">
  <h2>Certificat medical</h2>
  <label class="form-field">
    <span>Fichier du certificat</span>
    <input type="file" accept="application/pdf,image/jpeg,image/png" (change)="selectFile($event)" [disabled]="disabled() || loading()" />
  </label>
  @if (selectedFile()) {
    <p>{{ selectedFile()!.name }} - {{ selectedFile()!.size }} octets</p>
  }
  @if (success()) { <p>{{ success() }}</p> }
  @if (error()) { <p class="form-error" role="alert">{{ error() }}</p> }
  <button class="primary-button" type="button" (click)="upload()" [disabled]="!selectedFile() || disabled() || loading()">Televerser</button>
</section>
