<section class="resource-page">
  <header class="page-header">
    <div><h1>Medical Documents</h1><p>Lookup medical certificate metadata by document id. List-all requires a future backend endpoint.</p></div>
  </header>
  <div class="toolbar">
    <label class="form-field"><span>Document ID</span><input type="number" [ngModel]="documentId()" (ngModelChange)="documentId.set($event ? +$event : null)" /></label>
    <button class="primary-button" type="button" (click)="lookup()" [disabled]="!documentId() || loading()">Lookup</button>
  </div>
  @if (error()) { <p class="state error" role="alert">{{ error() }}</p> }
  @if (loading()) { <p class="state">Loading medical document...</p> }
  @if (metadata()) {
    <app-medical-document-metadata [document]="metadata()!" [canManage]="true" (download)="download($event)" (delete)="deletingId.set($event)" />
  } @else if (!loading()) {
    <p class="state">No document selected.</p>
  }
</section>
@if (deletingId()) {
  <app-delete-medical-document-dialog [documentId]="deletingId()!" [loading]="loading()" [error]="error()" (confirmDelete)="deleteDocument()" (cancel)="deletingId.set(null)" />
}
