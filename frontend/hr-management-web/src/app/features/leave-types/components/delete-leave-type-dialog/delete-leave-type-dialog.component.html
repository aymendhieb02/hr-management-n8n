<div class="dialog-backdrop">
  <section class="dialog" aria-labelledby="delete-leave-type-title">
    <h2 id="delete-leave-type-title">Delete Leave Type</h2>
    <p>Delete <strong>{{ leaveType().name }}</strong>?</p>
    <p class="description">Deletion may fail when leave requests or balances reference this leave type.</p>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="dialog-actions">
      <button class="secondary-button" type="button" (click)="cancel.emit()" [disabled]="loading()">Cancel</button>
      <button class="danger-button" type="button" (click)="confirmDelete.emit()" [disabled]="loading()">
        {{ loading() ? 'Deleting...' : 'Delete' }}
      </button>
    </div>
  </section>
</div>
