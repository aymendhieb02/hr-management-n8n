<div class="toolbar">
  <label class="form-field"><span>Report</span><select [ngModel]="reportType()" (ngModelChange)="reportTypeChange.emit($event)"><option value="leave-requests">Leave Requests</option><option value="leave-balances">Leave Balances</option><option value="employees">Employees</option><option value="department-summary">Department Summary</option></select></label>
  <label class="form-field"><span>Start</span><input type="date" [ngModel]="filters().startDate" (ngModelChange)="update('startDate', $event)" /></label>
  <label class="form-field"><span>End</span><input type="date" [ngModel]="filters().endDate" (ngModelChange)="update('endDate', $event)" /></label>
  <label class="form-field"><span>Status</span><select [ngModel]="filters().status" (ngModelChange)="update('status', $event)"><option value="">All</option><option>PENDING</option><option>APPROVED</option><option>REJECTED</option></select></label>
  <label class="form-field"><span>Leave Type</span><select [ngModel]="filters().leaveType" (ngModelChange)="update('leaveType', $event)"><option value="">All</option>@for (type of leaveTypes(); track type) { <option [value]="type">{{ type }}</option> }</select></label>
  <label class="form-field"><span>Department</span><select [ngModel]="filters().department" (ngModelChange)="update('department', $event)"><option value="">All</option>@for (department of departments(); track department) { <option [value]="department">{{ department }}</option> }</select></label>
  <label class="form-field"><span>User</span><select [ngModel]="filters().userId" (ngModelChange)="update('userId', $event)"><option value="">All</option>@for (user of users(); track user.id) { <option [value]="user.id">{{ user.name }}</option> }</select></label>
  <label class="form-field"><span>Year</span><input type="number" [ngModel]="filters().year" (ngModelChange)="update('year', $event)" /></label>
</div>
