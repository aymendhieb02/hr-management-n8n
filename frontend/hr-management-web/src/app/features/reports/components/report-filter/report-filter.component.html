<div class="toolbar">
  <label class="form-field"><span>Type de rapport</span><select [ngModel]="reportType()" (ngModelChange)="reportTypeChange.emit($event)"><option value="leave-requests">Demandes de congé</option><option value="leave-balances">Soldes de congé</option><option value="employees">Employés</option></select></label>
  <label class="form-field"><span>Date de début</span><input type="date" [ngModel]="filters().startDate" (ngModelChange)="update('startDate', $event)" /></label>
  <label class="form-field"><span>Date de fin</span><input type="date" [ngModel]="filters().endDate" (ngModelChange)="update('endDate', $event)" /></label>
  <label class="form-field"><span>Statut</span><select [ngModel]="filters().status" (ngModelChange)="update('status', $event)"><option value="">Tous les statuts</option><option value="PENDING">En attente</option><option value="APPROVED">Approuvée</option><option value="REJECTED">Refusée</option></select></label>
  <label class="form-field"><span>Type de congé</span><select [ngModel]="filters().leaveType" (ngModelChange)="update('leaveType', $event)"><option value="">Tous les types</option>@for (type of leaveTypes(); track type) { <option [value]="type">{{ type }}</option> }</select></label>
  <label class="form-field"><span>Employé</span><select [ngModel]="filters().userId" (ngModelChange)="update('userId', $event)"><option value="">Tous les employés</option>@for (user of users(); track user.id) { <option [value]="user.id">{{ user.name }}</option> }</select></label>
  <label class="form-field"><span>Année</span><input type="number" placeholder="Ex. 2026" [ngModel]="filters().year" (ngModelChange)="update('year', $event)" /></label>
</div>
