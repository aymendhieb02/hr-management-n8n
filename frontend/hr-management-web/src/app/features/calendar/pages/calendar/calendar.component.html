<section class="resource-page">
  <header class="page-header"><div><h1>{{ title() }}</h1><p>Consultez les congés, autorisations d'absence et jours fériés par semaine.</p></div></header>
  <div class="toolbar calendar-toolbar">
    <div class="calendar-navigation">
      <button class="primary-button" type="button" (click)="today()">Aujourd'hui</button>
      <button class="secondary-button arrow-button" aria-label="Semaine précédente" type="button" (click)="previousWeek()">‹</button>
      <button class="secondary-button arrow-button" aria-label="Semaine suivante" type="button" (click)="nextWeek()">›</button>
    </div>
    <strong class="calendar-period">{{ month().toLocaleString('fr-FR', { month: 'long', year: 'numeric' }) }}</strong>
    <div class="calendar-filters">
      <label class="form-field"><span>Catégorie</span><select [ngModel]="leaveTypeFilter()" (ngModelChange)="leaveTypeFilter.set($event)"><option value="">Toutes les catégories</option>@for (type of leaveTypes(); track type) { <option [value]="type">{{ type }}</option> }</select></label>
      <label class="form-field"><span>Statut</span><select [ngModel]="statusFilter()" (ngModelChange)="statusFilter.set($event)"><option value="">Tous les statuts</option>@for (status of statuses(); track status) { <option [value]="status">{{ statusLabel(status) }}</option> }</select></label>
    </div>
  </div>
  @if (error()) { <p class="state error">{{ error() }}</p> }
  @if (loading()) { <p class="state">Chargement du calendrier...</p> }
  @else {
    <app-week-planner [selectedDate]="month()" [events]="filteredEvents()" (dateSelected)="selectDate($event)" />
  }
</section>
