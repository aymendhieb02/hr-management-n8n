server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hr-management-api

  datasource:
    # CONVERT_TO_NULL protège l'application contre les anciennes dates MySQL
    # 0000-00-00 importées avant l'activation du mode SQL strict.
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/rh_xtensus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Tunis&zeroDateTimeBehavior=CONVERT_TO_NULL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:12MB}

app:
  security:
    jwt-secret: ${JWT_SECRET:replace_with_a_secure_secret_of_at_least_32_characters}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    # false uniquement pour le développement local en HTTP. Utiliser true en HTTPS.
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

  storage:
    medical-certificates-path: ${MEDICAL_CERTIFICATES_PATH:./storage/medical-certificates}
    max-file-size: 5MB
    profile-photo-max-file-size: ${PROFILE_PHOTO_MAX_FILE_SIZE:10MB}
    allowed-types:
      - application/pdf
      - image/jpeg
      - image/png
    profile-photos-path: ${PROFILE_PHOTOS_PATH:./storage/profile-photos}

  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@xtensus.com}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}
    logo-url: ${MAIL_LOGO_URL:https://xtensus.com/wp-content/uploads/2023/04/logo.png}

  leave-accrual:
    enabled: ${LEAVE_ACCRUAL_ENABLED:true}
    monthly-days: ${LEAVE_ACCRUAL_MONTHLY_DAYS:2.16}
    cron: ${LEAVE_ACCRUAL_CRON:0 0 1 1 * *}
    zone: ${LEAVE_ACCRUAL_ZONE:Africa/Tunis}
