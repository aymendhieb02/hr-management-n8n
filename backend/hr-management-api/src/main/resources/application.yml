server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hr-management-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/RH_XTENSUS}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  security:
    jwt-secret: ${JWT_SECRET:replace_with_a_secure_secret_of_at_least_32_characters}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  storage:
    medical-certificates-path: ${MEDICAL_CERTIFICATES_PATH:./storage/medical-certificates}
    max-file-size: 5MB
    allowed-types:
      - application/pdf
      - image/jpeg
      - image/png

  leave-accrual:
    enabled: ${LEAVE_ACCRUAL_ENABLED:true}
    monthly-days: ${LEAVE_ACCRUAL_MONTHLY_DAYS:2.16}
    cron: ${LEAVE_ACCRUAL_CRON:0 0 1 1 * *}
    zone: ${LEAVE_ACCRUAL_ZONE:Africa/Tunis}
